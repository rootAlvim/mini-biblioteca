<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pagina do autor </title>
</head>
<body>
    <h1>Livros de {{autor}}</h1>
    {% for livro in livros %}
        <h2>{{ livro.titulo }}</h2>
        <p>Ano: {{ livro.ano_publicacao }}</p>
    {% endfor %}
</body>
</html>
