<!DOCTYPE html>
<html>
<head>
    <title>Lista de Livros</title>
</head>
<body>

    <h1>Livros</h1>

    {% for livro in livros %}
        <h2>{{ livro.titulo }}</h2>
        <a href="{% url 'autor' livro.autor.id %}">Autor: {{ livro.autor }}</a>
        <p>Ano: {{ livro.ano_publicacao }}</p>
    {% endfor %}

</body>
</html>
