<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <h1>Criar Autor</h1>

    <form action="{% url 'criar-autor' %}" method="post">

        {% csrf_token %}
        <div>
            {{form.nome.label_tag}}
            {{form.nome}}
            {{form.nome.errors}}
        </div>
        <div>
            {{form.nacionalidade.label_tag}}
            {{form.nacionalidade}}
            {{form.nacionalidade.errors}}
        </div>

        <button type="submit">Criar</button>

    </form>
</body>

</html>
