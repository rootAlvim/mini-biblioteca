<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Consulta IBGE</title>
</head>
<body>
    <h1>Buscar Municípios do IBGE</h1>

    <form action="" method="GET">
        <label for="id">Escolha uma Cidade:</label>
        <select name="id" id="id" required>
            <option value="">-- Selecione uma Cidade --</option>
            {% for c in cidades_select %}
                <option value="{{ c.id }}">{{ c.nome }}</option>
            {% endfor %}
        </select>
        <button type="submit">Consultar Detalhes</button>
    </form>

</body>
</html>
